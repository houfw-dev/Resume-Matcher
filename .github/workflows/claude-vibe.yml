name: Ark CodePlan Pro Issue to PR
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  codeplan:
    if: >
      github.event.issue != null
      && (
        (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude'))
        ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'vibe-coding')
        ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI + GitHub CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt update && sudo apt install gh -y

      # 🔑 关键新增：预置信任状态，让项目 settings.json 的 permissions 生效
      - name: Trust workspace for Claude Code
        run: |
          mkdir -p "$HOME"
          cat > "$HOME/.claude.json" <<EOF
          {
            "projects": {
              "${GITHUB_WORKSPACE}": {
                "hasTrustDialogAccepted": true,
                "allowedTools": ["Write", "Edit", "Bash", "Read", "Glob", "Grep"]
              }
            }
          }
          EOF

      - name: Run CodePlan（火山方舟）
        env:
          ANTHROPIC_BASE_URL: https://ark.cn-beijing.volces.com/api/coding
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ARK_API_KEY }}
          ANTHROPIC_MODEL: ark-code-latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "=====DEBUG INFO===="
          echo "claude version: $(claude --version)"
          echo "REPO: $REPO  ISSUE: $ISSUE_NUMBER"
          echo "==================="

          ISSUE_BODY=$(gh issue view $ISSUE_NUMBER --repo $REPO --json title,body -q '.title + "\n" + .body')
          BRANCH_NAME="codeplan/issue-${ISSUE_NUMBER}"
          DEFAULT_BRANCH=$(gh repo view $REPO --json defaultBranchRef -q '.defaultBranchRef.name')

          git checkout -b $BRANCH_NAME

          # ==========新增这两行，解决git身份报错==========
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ===========================================

          PROMPT="你是代码工程师，根据下面需求直接修改仓库代码，只输出修改，不要多余解释：
          ${ISSUE_BODY}
          完成后直接写文件，不需要询问确认"

          # 🔑 关键：--dangerously-skip-permissions 才是真正免确认参数
          claude -p "${PROMPT}" --dangerously-skip-permissions

          if [[ -z $(git status --porcelain) ]]; then
            echo "没有代码变更，跳过提交和PR"
            exit 0
          fi

          git add .
          git commit -m "Auto fix from issue #${ISSUE_NUMBER}"
          git push -u origin $BRANCH_NAME
          gh pr create --base $DEFAULT_BRANCH --head $BRANCH_NAME \
            --title "Auto PR for issue #${ISSUE_NUMBER}" \
            --body "Auto generated by CodePlan Pro, issue #${ISSUE_NUMBER}"
