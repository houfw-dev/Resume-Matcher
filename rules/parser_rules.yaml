# 正则字符串。每项形如：
#   名称:
#     pattern: "正则字符串"
#     flags: [IGNORECASE]        # 可省略；白名单：IGNORECASE/MULTILINE/DOTALL/UNICODE
# 编译发生在加载期，pattern 非法会阻止应用启动。动态拼接型正则（命名分组
# 总正则、月份表拼接的 _CANON_EN_POINT_RE / _START_DATE_RE 等）组合逻辑留
# 在 parser.py，不进本段。
patterns:
  # --- Markdown 日期抽取（restore_dates_from_markdown 族）-----------------
  # 英文月份区间/单日期："Jan 2020 - Dec 2023"、"Jun 2023"。
  md_date:
    pattern: (?:(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{4})(?:\s*[-–—]\s*(?:(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{4}|Present|Current|Now|Ongoing))?
    flags: [IGNORECASE]
  # 英文月份单词（无年份），用于回插英文日期文本。
  month_en:
    pattern: \b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)
    flags: [IGNORECASE]
  # 中文简历常见数字日期区间："2017.09 - 2021.07"、"2025.07 - 至今"。
  # 月份后不得再跟日组件（"21.0.1" 不匹配），年份必须四位。
  numeric_date:
    pattern: \d{4}\s*[年./-]\s*(?:0?[1-9]|1[0-2])(?!\d|[./-]\d)(?:\s*月)?(?:\s*[-–—~～]\s*(?:\d{4}\s*[年./-]\s*(?:0?[1-9]|1[0-2])(?!\d|[./-]\d)(?:\s*月)?|至今|现在|目前|Present|Current|Now|Ongoing))?
    flags: [IGNORECASE]
  # 开放结束标记（中文三词 + 英文四词）。
  present_marker:
    pattern: 至今|现在|目前|Present|Current|Now|Ongoing
    flags: [IGNORECASE]
  # 已带月份精度的数字年月（无区间尾段）。
  numeric_month_precise:
    pattern: \d{4}\s*[年./-]\s*(?:0?[1-9]|1[0-2])(?!\d|[./-]\d)

  # --- canonicalize_date_period 规范化族 ----------------------------------
  # 数字年月点 "2020.06" / "2020年6月"（无日部分），两个捕获组为年、月。
  canon_numeric_point:
    pattern: (\d{4})\s*[年./-]\s*(0?[1-9]|1[0-2])(?!\d|[./-]\d)(?:\s*月)?
  # 裸四位年份，且两侧不邻接其他日期组件。
  canon_bare_year:
    pattern: (?<![\d.])(\d{4})(?!\d|[./-]\d)
  # 开放结束标记，规范化后统一渲染为 至今。
  canon_present:
    pattern: 至今|现在|目前|Present|Current|Now|Ongoing
    flags: [IGNORECASE]
  # 英文连接词 "to"（中文连接符走 skip 字符集，留代码）。
  canon_connector_word:
    pattern: \bto\b
    flags: [IGNORECASE]
  # 日期串尾部唯一允许的括号注释，如 "2020.06~2023.09（实习）"。
  canon_trailing_note:
    pattern: ^[（(][^（）()]*[)）]\s*$

  # --- Markdown / URL 清理族 ----------------------------------------------
  # 行内 Markdown 链接/图片 "[文字](url)"，捕获组 1 为 url 目标。
  markdown_inline_link:
    pattern: '!?\[[^\]]*\]\(\s*([^)\s]*)\s*\)'
  # 裸 URL（http(s):// 或 www. 开头），在全角/半角分隔符处截断。
  bare_url:
    pattern: (?:https?://|www\.)[^\s|｜，,；;）)】\]]+
  # 源文档自带的点号编号（"1、"/"①"/"一、"/"• "/" - "）；三端镜像，
  # 渲染侧会自行编号，存储内容保留前缀会造成双重编号。
  point_marker:
    pattern: ^\s*(?:\d{1,2}\s*[.、)）．:：]|[（(]\d{1,2}[)）]|[①-⑩]|[•·・●▪▸▹◆■]|[\-—–]\s+|[一二三四五六七八九十]{1,3}\s*[、.．)）])\s*
  # Markdown 强调标记（strip_markdown_emphasis 族）；bold 两条需要 DOTALL
  # 跨行匹配，斜体靠 lookaround 避免误伤单词内星号/下划线。
  md_bold_star:
    pattern: \*\*\s*([^*]+?)\s*\*\*
    flags: [DOTALL]
  md_bold_under:
    pattern: __\s*([^_]+?)__
    flags: [DOTALL]
  md_italic_star:
    pattern: (?<![\w*])\*([^*\s][^*]*?)\*(?![\w*])
  md_italic_under:
    pattern: (?<![\w_])_([^_\s][^_]*?)_(?![\w_])
  md_code:
    pattern: '`+([^`]+?)`+'
  md_strike:
    pattern: ~~([^~]+?)~~
  # 孤立强调标记（无闭合），清理阶段直接移除。
  md_orphan_bold:
    pattern: \*\*|__
  md_orphan_strike:
    pattern: ~~
  # 个人链接 host 判定（github.io / github.com 子域）。
  github_host:
    pattern: (?:^|\.)github\.com$
    flags: [IGNORECASE]

  # --- 教育/错放凭证区 -----------------------------------------------------
  # 证书类条目的内容提示词（仅在显式凭证标签区域内使用）。
  edu_cert_item_hint:
    pattern: 证书|认证|资格|资质|执照
  # 凭证条目之间的分句符。
  edu_credential_clause:
    pattern: '[；;。\n，,]+'
  # 错放区条目的路由证据词（证书/语言/奖项三个桶），强证据优先。
  misfile_cert_item_hint:
    pattern: PMP|CPA|CFA|ACCA|AWS|Azure|Google\s*Cloud|OCI|ITIL|CKA|Licen[cs]e|Certified|证书|认证|资格|资质|执照|执业|结业证
    flags: [IGNORECASE]
  misfile_lang_item_hint:
    pattern: 英语|日语|韩语|法语|德语|俄语|西班牙语|葡萄牙语|意大利语|阿拉伯语|泰语|越南语|印尼语|马来语|粤语|普通话|汉语|中文|外语|口语|口译|笔译|雅思|IELTS|托福|TOEFL|GRE|GMAT|SAT|TESOL|TEFL|CATTI|CET|大学英语|专四|专八|四级|六级|八级|N[1-5](?![0-9])|English|Japanese|Korean|French|German|Spanish|Mandarin|Cantonese
    flags: [IGNORECASE]
  misfile_award_item_hint:
    pattern: 奖|荣誉|荣获|获奖|奖学金|冠军|亚军|季军|金奖|银奖|铜奖|表彰|勋章|标兵|三好|优秀|先进|奖章|立功|嘉奖|Dean'?s List|Cum Laude|Magna|Summa|Prize|Scholarship|Fellowship|Medal|Honor Roll|Recognition|Champion|Runner[- ]?up|Awards?|Honou?rs
    flags: [IGNORECASE]

  # --- 技术栈分类 / 项目头字段 / 工作部门行 -------------------------------
  # 结构化技术栈分类行（"后端：Java、Spring Boot"），三端镜像；短冒号形状。
  tech_stack_category:
    pattern: ^[一-鿿A-Za-z][一-鿿A-Za-z0-9/（）() -]{0,10}[：:]\s*\S
  # 分类行里出现句末标点即视为普通句子而非枚举行。
  category_sentence:
    pattern: '[。；！？!?;]'
  # 项目描述里应提升到项目头的 规模/角色 标签行（两个命名捕获组）。
  project_header_field:
    pattern: ^\s*(?:\d{1,2}\s*[.、)）．:：]\s*)?(?P<label>项目规模|团队规模|项目角色|担任角色)\s*[：:]\s*(?P<value>.+?)\s*$
  # 独立组织单位行（"研发部" / "Payments Team"）的紧门闩形状。
  work_department_line:
    pattern: ^\s*(?:[一-鿿][一-鿿A-Za-z0-9（）()·&/+\- ]{0,13}(?:事业部|事业群|部门|条线|分院|大区|办公室|中心|团队|小组|[部组室科处])|[A-Za-z0-9][A-Za-z0-9 &/+\-]{1,28}(?:Department|Dept\.?|Division|Team|Group))(?:[（(][^（）()]{1,12}[）)])?\s*$
  # 部门行禁用的整句标点。
  work_department_sentence_punct:
    pattern: '[。．.，,；;：:！!？?、…]'
