# 简历解析规则制品（人工编辑源）
#
# 链路：本文件
#   -> scripts/export_parser_rules.py（ephemeral PyYAML，运行时不依赖 yaml）
#   -> apps/backend/app/services/parser_rules.json（随包入库的运行时唯一制品）
#
# 只放声明式数据：数值阈值、词表/别名、正则字符串。解析流水线顺序、区域状态机、
# 日期消歧打分、容器校验、ResumeData schema 与 CJK Unicode 字形表属于结构契约，
# 永远留在 Python 代码里，不进本文件。
#
# 改完重新导出（仓库根目录）：
#   uv run --with pyyaml python -I scripts/export_parser_rules.py
# 坏正则 / 缺段 / 未知 flags 会在导出期响亮报错；运行时加载器（parser_rules.py）
# 对 JSON 制品再做一次同样的 fail-fast 校验。

spec_version: "1.0"

# 数值/标量阈值（标量：int / float / str；不接受 bool，避免 YAML yes/no 歧义）。
# 只放业务识别阈值；文档安全预算（解压上限、转换超时、递归深度等运维参数）
# 留在 parser.py 代码里，不进本文件。
thresholds:
  # 头部事实标签超出此前导字符数即视为正文标签（如职位里的「电话销售」）。
  header_search_limit: 2000
  # 专业技能分组标题识别：标题最大长度、成组最少标题数、细节描述最小长度。
  skill_group_head_max_len: 14
  skill_group_min_heads: 2
  skill_detail_min_len: 16
  # 嵌套技能分组标题识别（参数语义同上）。
  nested_group_head_max_len: 16
  nested_group_min_heads: 2
  # 错放凭证区域：失去标签边界后最多延续的行数，超出即放弃搬运。
  misfile_region_max_rows: 6
  # pypdfium2 字形丢失回退的最低 CJK 字符保留比例。
  pdfium_min_cjk_ratio: 0.6
  # 头部事实值里内嵌「标签：」的最大标签长度（_EMBEDDED_LABEL_RE 量词）。
  embedded_label_max_len: 11
  # 独立标签行的 CJK / latin 标签最大长度（_STANDALONE_SUB_LABEL_RE 量词）。
  standalone_label_cjk_max_len: 11
  standalone_label_latin_max_len: 20

vocabularies:
  # 头部「标签：值」事实格的识别片段。值是 regex 字符串（不是普通词表），按
  # ResumeData 字段命名；parser.py 负责把它们按序组合成带命名分组的总正则，
  # 组合算法与列边界判定留代码。片段在导出期与加载期都会单独 re.compile 校验。
  header_field_labels:
    name: 姓\s*名
    gender: 性\s*别
    age: 年\s*龄
    workYears: 工\s*作\s*(?:年\s*限|经\s*验|时\s*间)
    educationLevel: (?:最\s*高)?学\s*历
    languages: (?:外\s*语|语\s*言)\s*(?:水\s*平|能\s*力)|英\s*语\s*水\s*平
    phone: 联\s*系\s*电\s*话|电\s*话|手\s*机\s*号?\s*码?|Cell(?:\s*phone)?|Tel(?:ephone)?
    # email 片段刻意以具体 CJK/字母字符开头（无前导 \s*），列边界检查才能
    # 落在标签前一个字符而不是 padding 空白里。
    email: (?:电\s*子\s*)?邮\s*(?:箱|件)|E\s*-?\s*[Mm]ail
    title: 求\s*职\s*意\s*向|期\s*望\s*(?:职\s*位|岗\s*位|职\s*业)|意\s*向\s*(?:职\s*位|岗\s*位|职\s*业)|目\s*标\s*岗\s*位
    location: (?:期\s*望|意\s*向|工\s*作)\s*(?:城\s*市|地\s*点)
    # 个人链接格与事实格共用头部行；识别出它们才能正确截断上一个事实的值域。
    website: 博\s*客\s*地\s*址|个\s*人\s*网\s*站|个\s*人\s*主\s*页|个\s*人\s*博\s*客|个\s*人\s*网\s*址|主\s*页|博\s*客|网\s*站|网\s*址|Website|Web\s*site|Homepage|Blog(?:\s*site)?
    linkedin: 领\s*英|Linked\s*[Ii]n
    github: Git\s*[Hh]ub

  # 头部「基本资料」类区块标题（命中后开启头部事实扫描区）。
  header_basic_headings:
