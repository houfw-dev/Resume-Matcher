# Shared cross-stack technical term tables — the single human-maintained
# source for terms with MORE THAN ONE backend/frontend consumer.
#
# Export chain (PyYAML is export-time-only; nothing reads YAML at runtime):
#   1. scripts/export_parser_rules.py merges `canonical_tech_terms` into
#      apps/backend/app/services/parser_rules.json (the backend's only runtime
#      artifact; app/services/tech_terms.py binds through its Pydantic loader).
#   2. scripts/generate_frontend_rules.py emits
#      apps/frontend/lib/generated/tech-terms.generated.ts (committed; the
#      frontend build has no uv/PyYAML).
#   3. scripts/check_generated_rules.py (stdlib only) verifies the generated
#      TypeScript still matches the shipped JSON and blocks pushes on drift.
#
# Only PUBLIC, non-confidential word lists belong here. Diagnosis criterion/QC
# text and the mainstream-stack equivalence notes never leave the backend.
#
# Regenerate after editing:
#   uv run --with pyyaml python -I scripts/export_parser_rules.py
#   uv run --with pyyaml python -I scripts/generate_frontend_rules.py
spec_version: "1.0"

# Canonical casing table for technical English terms. Casing-only fixes
# ("java" -> "Java"); order is irrelevant because every consumer rebuilds the
# alternation longest-first. Keep entries unique and non-blank.
